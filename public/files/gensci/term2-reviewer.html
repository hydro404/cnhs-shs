<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Science Term 2 Reviewer</title>
    <style>
        :root {
            /* Fresh and vibrant projector-friendly dark theme */
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-accent: #38bdf8;
            --btn-default: #0284c7;
            --btn-hover: #0369a1;
            --btn-correct: #10b981;
            --btn-wrong: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 4rem;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #334155;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #334155;
        }

        h1 {
            font-size: 3rem;
            color: var(--text-accent);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .score-board {
            font-size: 2.2rem;
            font-weight: bold;
            background: #0f172a;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            border: 2px solid #334155;
            color: #fbbf24;
        }

        .tracker {
            font-size: 1.8rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 2.8rem;
            line-height: 1.5;
            margin-bottom: 4rem;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3.5rem;
        }

        .option-btn {
            background-color: #334155;
            color: var(--text-main);
            border: 3px solid transparent;
            padding: 2rem;
            font-size: 2rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            text-align: left;
            line-height: 1.3;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            transform: translateY(-4px);
            border-color: var(--text-accent);
        }

        .option-letter {
            font-weight: bold;
            color: var(--text-accent);
            margin-right: 1.5rem;
            font-size: 2.5rem;
        }

        .option-btn.wrong {
            background-color: rgba(225, 29, 72, 0.15);
            border-color: var(--btn-wrong);
            color: #fda4af;
            cursor: not-allowed;
            transform: none;
        }
        .option-btn.wrong .option-letter { color: var(--btn-wrong); }

        .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.2);
            border-color: var(--btn-correct);
            color: #a7f3d0;
            cursor: default;
        }
        .option-btn.correct .option-letter { color: var(--btn-correct); }

        #next-btn {
            background-color: var(--btn-default);
            color: white;
            border: none;
            padding: 1.5rem 4rem;
            font-size: 2.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            margin: 0 auto;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #next-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.05);
        }

        #finish-screen {
            display: none;
        }

        #finish-screen h2 {
            font-size: 5rem;
            color: var(--btn-correct);
            margin-bottom: 2rem;
        }
        
        #finish-screen p {
            font-size: 3.5rem;
            margin-bottom: 4rem;
        }

        /* Match the mobile-first design used by the 40-question reviewer. */
        :root {
            --paper: #fffdf6;
            --ink: #171717;
            --muted: #626262;
            --line: #171717;
            --soft: #f1efe6;
            --accent: #f6d365;
            --success: #c8f7d4;
            --danger: #ffd5d2;
        }
        body {
            min-height: 100vh;
            display: block;
            padding: 0;
            color: var(--ink);
            background: #e9e7df;
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
        }
        .shell { width: 100%; min-height: 100vh; }
        .card {
            min-height: 100vh;
            padding: 20px 16px 28px;
            overflow: visible;
            color: var(--ink);
            border: 0;
            border-radius: 0;
            background: var(--paper);
            box-shadow: none;
        }
        header { align-items: flex-start; gap: 12px; margin-bottom: 18px; padding: 0; border: 0; }
        .brand { display: flex; align-items: flex-start; gap: 11px; }
        .brand-icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            flex: 0 0 auto;
            color: var(--ink);
            border: 2px solid var(--line);
            border-radius: 8px;
            background: var(--accent);
            box-shadow: 3px 3px 0 var(--line);
            font-size: 21px;
        }
        .kicker { margin: 0 0 2px; color: var(--muted); font-size: .67rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; color: var(--ink); font-size: 1.22rem; font-weight: 800; letter-spacing: -.025em; text-transform: none; }
        .score { min-width: 78px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: white; box-shadow: 3px 3px 0 var(--line); text-align: center; }
        .score-label { display: block; color: var(--muted); font-size: .62rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .score-value { display: block; margin-top: 1px; font-size: 1.04rem; font-weight: 950; font-variant-numeric: tabular-nums; }
        .progress-track { height: 9px; margin-bottom: 18px; overflow: hidden; border: 2px solid var(--line); background: white; }
        .progress-bar { width: 5%; height: 100%; background: var(--ink); transition: width .3s ease; }
        .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .question-count, .topic { padding: 6px 9px; border: 2px solid var(--line); border-radius: 6px; color: var(--ink); background: white; font-size: .66rem; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
        .topic { background: var(--accent); }
        .question { margin: 0 0 20px; color: var(--ink); font-size: clamp(1.42rem, 7vw, 2rem); line-height: 1.22; font-weight: 800; letter-spacing: -.035em; }
        .choices { display: grid; grid-template-columns: 1fr; gap: 11px; }
        .choice {
            width: 100%;
            min-height: 68px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            color: var(--ink);
            border: 2px solid var(--line);
            border-radius: 8px;
            background: white;
            box-shadow: 4px 4px 0 var(--line);
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
        }
        .choice:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--line); }
        .choice:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
        .choice:focus-visible { outline: 4px solid #90b9ff; outline-offset: 3px; }
        .choice:disabled { cursor: default; opacity: 1; }
        .letter { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 38px; border: 2px solid var(--line); border-radius: 6px; background: var(--soft); font-size: 1rem; font-weight: 950; }
        .result { margin-left: auto; opacity: 0; font-size: 1.3rem; font-weight: 950; transform: scale(.65); transition: .2s ease; }
        .choice.correct { color: var(--ink); border-color: var(--line); background: var(--success); box-shadow: 4px 4px 0 var(--line); }
        .choice.wrong { color: var(--ink); border-color: var(--line); background: var(--danger); }
        .choice.correct .letter, .choice.wrong .letter { color: var(--ink); border-color: var(--line); background: white; }
        .choice.correct .result, .choice.wrong .result { opacity: 1; transform: scale(1); }
        .choice.celebrate { animation: correct-pop .55s cubic-bezier(.2, .9, .25, 1.35); }
        .feedback { min-height: 48px; margin-top: 17px; padding: 11px 12px; border: 2px solid transparent; border-radius: 8px; color: var(--muted); font-size: .88rem; font-weight: 650; line-height: 1.45; }
        .feedback.correct { color: var(--ink); border-color: var(--line); background: var(--success); }
        .feedback.wrong { color: var(--ink); border-color: var(--line); background: var(--danger); }
        .footer { display: flex; justify-content: flex-end; margin-top: 10px; }
        .next, .restart { display: none; align-items: center; gap: 8px; padding: 12px 17px; color: white; border: 2px solid var(--line); border-radius: 8px; background: var(--ink); box-shadow: 4px 4px 0 #818181; font: inherit; font-size: .94rem; font-weight: 900; cursor: pointer; }
        .next:hover, .restart:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 #818181; }
        #finish { display: none; text-align: center; padding: 70px 20px; }
        .finish-mark { display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 22px; color: var(--ink); border: 2px solid var(--line); border-radius: 12px; background: var(--accent); box-shadow: 6px 6px 0 var(--line); font-size: 2.3rem; }
        #finish h2 { margin: 0 0 12px; color: var(--ink); font-size: clamp(2rem, 10vw, 3.5rem); }
        #finish p { margin: 0 auto 28px; color: var(--muted); font-size: 1rem; line-height: 1.5; }
        .final-score { display: inline-block; margin: 8px auto 24px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 8px; background: white; box-shadow: 4px 4px 0 var(--line); font-size: 1.15rem; font-weight: 900; }
        .celebration { position: fixed; inset: 0; z-index: 20; overflow: hidden; pointer-events: none; }
        .spark { position: absolute; left: 50%; top: 52%; width: 10px; height: 14px; border: 2px solid var(--line); background: var(--accent); animation: burst .8s ease-out forwards; }
        .spark:nth-child(3n) { background: #9fe3c2; }
        .spark:nth-child(3n + 1) { background: #a9c9ff; }
        .enter { animation: rise .38s ease both; }
        @keyframes rise { from { opacity: 0; transform: translateY(11px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes correct-pop { 38% { transform: scale(1.035) rotate(-.6deg); } 68% { transform: scale(.99) rotate(.4deg); } }
        @keyframes burst { to { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
        @media (min-width: 700px) {
            .shell { display: grid; place-items: center; padding: 28px; }
            .card { width: min(820px, 100%); min-height: auto; padding: 32px; border: 2px solid var(--line); border-radius: 12px; box-shadow: 9px 9px 0 var(--line); }
            header { align-items: center; }
            h1 { font-size: 1.6rem; }
            .question { font-size: 2rem; }
            .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="shell">
        <section class="card" id="quiz">
            <header>
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">⚗</div>
                    <div><p class="kicker">Self-paced practice</p><h1>General Science Term 2 Reviewer</h1></div>
                </div>
                <div class="score" aria-live="polite"><span class="score-label">Score</span><span class="score-value" id="scoreValue">0 / 20</span></div>
            </header>
            <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
            <div class="meta"><span class="question-count" id="tracker">Question 1 of 20</span><span class="topic" id="topic"></span></div>
            <div class="question" id="question"></div>
            <div class="choices" id="choices"></div>
            <div class="feedback" id="feedback" aria-live="polite">Choose the answer you think is correct.</div>
            <div class="footer"><button class="next" id="next" type="button" onclick="nextQuestion()">Next question <span aria-hidden="true">→</span></button></div>
        </section>
        <section class="card" id="finish">
            <div class="finish-mark" aria-hidden="true">✓</div>
            <h2>Review complete.</h2>
            <p>You worked through all 20 General Science Term 2 questions.</p>
            <div class="final-score" id="finalScore"></div><br>
            <button class="restart" type="button" onclick="restartQuiz()" style="display:inline-flex">Review again <span aria-hidden="true">↻</span></button>
        </section>
    </main>

    <script>
        // Twenty Term 2 questions covering chemistry, life processes, and metabolism.
        const allQuestions = [
            { q: "What type of reaction happens when one substance breaks down into simpler substances?", options: { A: "Combustion reaction", B: "Decomposition reaction", C: "Respiration process", D: "Photosynthesis process" }, answer: "B" },
            { q: "Which reaction happens when an acid reacts with a carbonate, such as vinegar reacting with baking soda?", options: { A: "Acid-carbonate reaction", B: "Combustion reaction", C: "Decomposition reaction", D: "Photosynthesis reaction" }, answer: "A" },
            { q: "When vinegar is mixed with baking soda, bubbles of gas are produced. What does this show?", options: { A: "The solid melted into liquid.", B: "The liquid evaporated quickly.", C: "A chemical reaction occurred.", D: "A physical change happened." }, answer: "C" },
            { q: "What usually happens when an acid reacts with a metal such as zinc?", options: { A: "The metal turns into ice.", B: "The acid turns into sugar.", C: "No visible changes occur.", D: "Bubbles of gas are formed." }, answer: "D" },
            { q: "A student lights a piece of paper and it produces heat, light, and smoke. What type of reaction is this?", options: { A: "Combustion reaction", B: "Decomposition reaction", C: "Acid-carbonate reaction", D: "Photosynthesis reaction" }, answer: "A" },
            { q: "Which process uses heat to cause changes in food or drinks, such as milk, and help make them safer?", options: { A: "Rapid freezing", B: "Pasteurization", C: "Water filtering", D: "Food preserving" }, answer: "B" },
            { q: "Which of the following is an example of combustion?", options: { A: "Melting solid ice", B: "Dissolving white sugar", C: "Cutting raw vegetables", D: "Burning wood charcoal" }, answer: "D" },
            { q: "Why is pasteurization used for some foods and drinks?", options: { A: "To decrease temperature.", B: "To increase sweet flavor.", C: "To kill harmful bacteria.", D: "To change natural colors." }, answer: "C" },
            { q: "In the equation CH₄ + 2O₂ → CO₂ + 2H₂O, what substance reacts with methane?", options: { A: "Oxygen gas", B: "Water vapor", C: "Carbon dioxide", D: "Simple glucose" }, answer: "A" },
            { q: "The equations 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ shows that a plant uses carbon dioxide and water to produce glucose and oxygen. What process is taking place?", options: { A: "Respiration", B: "Combustion", C: "Decomposition", D: "Photosynthesis" }, answer: "D" },
            { q: "As shown in the photosynthesis equation 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, which substance is produced by photosynthesis?", options: { A: "Carbon dioxide gas", B: "Liquid water molecules", C: "Glucose sugar molecules", D: "Sunlight energy input" }, answer: "C" },
            { q: "The equation C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy shows that a body cell uses glucose and oxygen and releases energy. What process is represented by the equation?", options: { A: "Photosynthesis", B: "Cellular respiration", C: "Chemical combustion", D: "Food pasteurization" }, answer: "B" },
            { q: "In the equation C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy, which pair correctly shows the reactants?", options: { A: "Carbon dioxide and water", B: "Glucose and carbon dioxide", C: "Oxygen gas and water", D: "Glucose and oxygen gas" }, answer: "D" },
            { q: "A student looks at the equation 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ and says, “Plants do not use carbon dioxide when making food.” Which is the best response?", options: { A: "True, they only need oxygen gas.", B: "False, it is a required reactant.", C: "True, they only need pure water.", D: "False, they only need soil nitrogen." }, answer: "B" },
            { q: "What is metabolism?", options: { A: "All body chemical reactions.", B: "The movement of the muscles.", C: "The physical breathing process.", D: "The digestion of fluid intake." }, answer: "A" },
            { q: "Why is metabolism important to the body?", options: { A: "It stops all internal chemical processes.", B: "It helps the body obtain and use energy.", C: "It restricts the body from moving freely.", D: "It removes all oxygen out of the system." }, answer: "B" },
            { q: "After eating a meal, your body breaks down nutrients and uses them for energy. What is this an example of?", options: { A: "Human metabolism", B: "Rapid combustion", C: "Food pasteurization", D: "Plant photosynthesis" }, answer: "A" },
            { q: "A person exercises and their muscles need more energy. Which process helps provide usable energy for the cells?", options: { A: "Plant photosynthesis", B: "Food pasteurization", C: "Acid-base reactions", D: "Cellular respiration" }, answer: "D" },
            { q: "A student says, “Cellular respiration is the same as breathing.” Which statement best explains the difference?", options: { A: "Both are exactly the same physical process.", B: "Respiration uses oxygen to release energy.", C: "Breathing is the process making the glucose.", D: "Cellular respiration happens only in plants." }, answer: "B" },
            { q: "Which statement best explains why metabolism is important for a person who is active?", options: { A: "It prevents the cells from using nutrients.", B: "It stops the body from producing new energy.", C: "It allows cells to get energy for activities.", D: "It only occurs while a person is fast asleep." }, answer: "C" }
        ];

        allQuestions.forEach((question, index) => {
            if (index < 5) question.topic = "Chemical Reactions";
            else if (index < 9) question.topic = "Chemistry in Daily Life";
            else if (index < 14) question.topic = "Photosynthesis & Respiration";
            else question.topic = "Metabolism";
        });

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        const questionEl = document.getElementById("question");
        const choicesEl = document.getElementById("choices");
        const trackerEl = document.getElementById("tracker");
        const topicEl = document.getElementById("topic");
        const progressBar = document.getElementById("progressBar");
        const feedback = document.getElementById("feedback");
        const scoreValue = document.getElementById("scoreValue");
        const finalScore = document.getElementById("finalScore");
        const nextBtn = document.getElementById("next");
        const quiz = document.getElementById("quiz");
        const finish = document.getElementById("finish");

        function shuffled(items) {
            const copy = [...items];
            for (let index = copy.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
            }
            return copy;
        }

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = "none";
            choicesEl.innerHTML = "";

            const item = questions[currentIndex];
            trackerEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
            topicEl.textContent = item.topic;
            progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            questionEl.textContent = item.q;
            questionEl.classList.remove("enter");
            void questionEl.offsetWidth;
            questionEl.classList.add("enter");
            feedback.className = "feedback";
            feedback.textContent = "Choose the answer you think is correct.";
            scoreValue.textContent = `${score} / ${questions.length}`;

            const displayLetters = ["A", "B", "C", "D"];
            shuffled(Object.entries(item.options)).forEach(([originalLetter, text], index) => {
                const button = document.createElement("button");
                button.className = "choice";
                button.type = "button";
                button.dataset.answer = originalLetter;
                button.innerHTML = `<span class="letter">${displayLetters[index]}</span><span>${text}</span><span class="result" aria-hidden="true"></span>`;
                button.onclick = () => checkAnswer(originalLetter, button, item.answer);
                choicesEl.appendChild(button);
            });
        }

        function checkAnswer(selected, button, correct) {
            if (answered) return;
            answered = true;

            const buttons = [...choicesEl.querySelectorAll(".choice")];
            buttons.forEach(choice => { choice.disabled = true; });

            if (selected === correct) {
                score++;
                button.classList.add("correct", "celebrate");
                button.querySelector(".result").textContent = "✓";
                feedback.className = "feedback correct";
                feedback.textContent = "Correct! Nice work - keep the momentum going.";
                celebrate();
            } else {
                button.classList.add("wrong");
                button.querySelector(".result").textContent = "×";
                const correctButton = buttons.find(choice => choice.dataset.answer === correct);
                if (correctButton) {
                    correctButton.classList.add("correct");
                    correctButton.querySelector(".result").textContent = "✓";
                }
                feedback.className = "feedback wrong";
                feedback.textContent = "Not quite. The correct answer is highlighted so you can review it.";
            }

            scoreValue.textContent = `${score} / ${questions.length}`;
            nextBtn.style.display = "inline-flex";
            nextBtn.focus();
        }

        function celebrate() {
            const layer = document.createElement("div");
            layer.className = "celebration";
            for (let index = 0; index < 18; index++) {
                const spark = document.createElement("i");
                spark.className = "spark";
                const angle = (Math.PI * 2 * index) / 18;
                const distance = 90 + Math.random() * 110;
                spark.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
                spark.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
                spark.style.setProperty("--r", `${Math.random() * 360}deg`);
                layer.appendChild(spark);
            }
            document.body.appendChild(layer);
            window.setTimeout(() => layer.remove(), 850);
        }

        function nextQuestion() {
            if (!answered) return;
            currentIndex++;
            if (currentIndex < questions.length) loadQuestion();
            else showFinish();
        }

        function showFinish() {
            quiz.style.display = "none";
            finish.style.display = "block";
            finalScore.textContent = `Final score: ${score} / ${questions.length}`;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function restartQuiz() {
            questions = shuffled(allQuestions);
            currentIndex = 0;
            score = 0;
            answered = false;
            finish.style.display = "none";
            quiz.style.display = "block";
            loadQuestion();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        restartQuiz();
    </script>
</body>
</html>
