<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Science T2 ST2 Reviewer</title>
    <style>
        :root {
            /* Fresh and vibrant projector-friendly dark theme */
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-accent: #38bdf8;
            --btn-default: #0284c7;
            --btn-hover: #0369a1;
            --btn-correct: #10b981;
            --btn-wrong: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 4rem;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #334155;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #334155;
        }

        h1 {
            font-size: 3rem;
            color: var(--text-accent);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .score-board {
            font-size: 2.2rem;
            font-weight: bold;
            background: #0f172a;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            border: 2px solid #334155;
            color: #fbbf24;
        }

        .tracker {
            font-size: 1.8rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 2.8rem;
            line-height: 1.5;
            margin-bottom: 4rem;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3.5rem;
        }

        .option-btn {
            background-color: #334155;
            color: var(--text-main);
            border: 3px solid transparent;
            padding: 2rem;
            font-size: 2rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            text-align: left;
            line-height: 1.3;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            transform: translateY(-4px);
            border-color: var(--text-accent);
        }

        .option-letter {
            font-weight: bold;
            color: var(--text-accent);
            margin-right: 1.5rem;
            font-size: 2.5rem;
        }

        .option-btn.wrong {
            background-color: rgba(225, 29, 72, 0.15);
            border-color: var(--btn-wrong);
            color: #fda4af;
            cursor: not-allowed;
            transform: none;
        }
        .option-btn.wrong .option-letter { color: var(--btn-wrong); }

        .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.2);
            border-color: var(--btn-correct);
            color: #a7f3d0;
            cursor: default;
        }
        .option-btn.correct .option-letter { color: var(--btn-correct); }

        #next-btn {
            background-color: var(--btn-default);
            color: white;
            border: none;
            padding: 1.5rem 4rem;
            font-size: 2.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            margin: 0 auto;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #next-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.05);
        }

        #finish-screen {
            display: none;
        }

        #finish-screen h2 {
            font-size: 5rem;
            color: var(--btn-correct);
            margin-bottom: 2rem;
        }
        
        #finish-screen p {
            font-size: 3.5rem;
            margin-bottom: 4rem;
        }

        /* Match the mobile-first design used by the 40-question reviewer. */
        :root {
            --paper: #fffdf6;
            --ink: #171717;
            --muted: #626262;
            --line: #171717;
            --soft: #f1efe6;
            --accent: #f6d365;
            --success: #c8f7d4;
            --danger: #ffd5d2;
        }
        body {
            min-height: 100vh;
            display: block;
            padding: 0;
            color: var(--ink);
            background: #e9e7df;
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
        }
        .shell { width: 100%; min-height: 100vh; }
        .card {
            min-height: 100vh;
            padding: 20px 16px 28px;
            overflow: visible;
            color: var(--ink);
            border: 0;
            border-radius: 0;
            background: var(--paper);
            box-shadow: none;
        }
        header { align-items: flex-start; gap: 12px; margin-bottom: 18px; padding: 0; border: 0; }
        .brand { display: flex; align-items: flex-start; gap: 11px; }
        .brand-icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            flex: 0 0 auto;
            color: var(--ink);
            border: 2px solid var(--line);
            border-radius: 8px;
            background: var(--accent);
            box-shadow: 3px 3px 0 var(--line);
            font-size: 21px;
        }
        .kicker { margin: 0 0 2px; color: var(--muted); font-size: .67rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; color: var(--ink); font-size: 1.22rem; font-weight: 800; letter-spacing: -.025em; text-transform: none; }
        .score { min-width: 78px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: white; box-shadow: 3px 3px 0 var(--line); text-align: center; }
        .score-label { display: block; color: var(--muted); font-size: .62rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .score-value { display: block; margin-top: 1px; font-size: 1.04rem; font-weight: 950; font-variant-numeric: tabular-nums; }
        .progress-track { height: 9px; margin-bottom: 18px; overflow: hidden; border: 2px solid var(--line); background: white; }
        .progress-bar { width: 5%; height: 100%; background: var(--ink); transition: width .3s ease; }
        .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .question-count, .topic { padding: 6px 9px; border: 2px solid var(--line); border-radius: 6px; color: var(--ink); background: white; font-size: .66rem; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
        .topic { background: var(--accent); }
        .question { margin: 0 0 20px; color: var(--ink); font-size: clamp(1.42rem, 7vw, 2rem); line-height: 1.22; font-weight: 800; letter-spacing: -.035em; }
        .choices { display: grid; grid-template-columns: 1fr; gap: 11px; }
        .choice {
            width: 100%;
            min-height: 68px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            color: var(--ink);
            border: 2px solid var(--line);
            border-radius: 8px;
            background: white;
            box-shadow: 4px 4px 0 var(--line);
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            text-align: left;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
        }
        .choice:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--line); }
        .choice:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
        .choice:focus-visible { outline: 4px solid #90b9ff; outline-offset: 3px; }
        .choice:disabled { cursor: default; opacity: 1; }
        .letter { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 38px; border: 2px solid var(--line); border-radius: 6px; background: var(--soft); font-size: 1rem; font-weight: 950; }
        .result { margin-left: auto; opacity: 0; font-size: 1.3rem; font-weight: 950; transform: scale(.65); transition: .2s ease; }
        .choice.correct { color: var(--ink); border-color: var(--line); background: var(--success); box-shadow: 4px 4px 0 var(--line); }
        .choice.wrong { color: var(--ink); border-color: var(--line); background: var(--danger); }
        .choice.correct .letter, .choice.wrong .letter { color: var(--ink); border-color: var(--line); background: white; }
        .choice.correct .result, .choice.wrong .result { opacity: 1; transform: scale(1); }
        .choice.celebrate { animation: correct-pop .55s cubic-bezier(.2, .9, .25, 1.35); }
        .feedback { min-height: 48px; margin-top: 17px; padding: 11px 12px; border: 2px solid transparent; border-radius: 8px; color: var(--muted); font-size: .88rem; font-weight: 650; line-height: 1.45; }
        .feedback.correct { color: var(--ink); border-color: var(--line); background: var(--success); }
        .feedback.wrong { color: var(--ink); border-color: var(--line); background: var(--danger); }
        .footer { display: flex; justify-content: flex-end; margin-top: 10px; }
        .next, .restart { display: none; align-items: center; gap: 8px; padding: 12px 17px; color: white; border: 2px solid var(--line); border-radius: 8px; background: var(--ink); box-shadow: 4px 4px 0 #818181; font: inherit; font-size: .94rem; font-weight: 900; cursor: pointer; }
        .next:hover, .restart:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 #818181; }
        #finish { display: none; text-align: center; padding: 70px 20px; }
        .finish-mark { display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 22px; color: var(--ink); border: 2px solid var(--line); border-radius: 12px; background: var(--accent); box-shadow: 6px 6px 0 var(--line); font-size: 2.3rem; }
        #finish h2 { margin: 0 0 12px; color: var(--ink); font-size: clamp(2rem, 10vw, 3.5rem); }
        #finish p { margin: 0 auto 28px; color: var(--muted); font-size: 1rem; line-height: 1.5; }
        .final-score { display: inline-block; margin: 8px auto 24px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 8px; background: white; box-shadow: 4px 4px 0 var(--line); font-size: 1.15rem; font-weight: 900; }
        .celebration { position: fixed; inset: 0; z-index: 20; overflow: hidden; pointer-events: none; }
        .spark { position: absolute; left: 50%; top: 52%; width: 10px; height: 14px; border: 2px solid var(--line); background: var(--accent); animation: burst .8s ease-out forwards; }
        .spark:nth-child(3n) { background: #9fe3c2; }
        .spark:nth-child(3n + 1) { background: #a9c9ff; }
        .enter { animation: rise .38s ease both; }
        @keyframes rise { from { opacity: 0; transform: translateY(11px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes correct-pop { 38% { transform: scale(1.035) rotate(-.6deg); } 68% { transform: scale(.99) rotate(.4deg); } }
        @keyframes burst { to { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
        @media (min-width: 700px) {
            .shell { display: grid; place-items: center; padding: 28px; }
            .card { width: min(820px, 100%); min-height: auto; padding: 32px; border: 2px solid var(--line); border-radius: 12px; box-shadow: 9px 9px 0 var(--line); }
            header { align-items: center; }
            h1 { font-size: 1.6rem; }
            .question { font-size: 2rem; }
            .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
    <style>
        /* Short explanation shown after each answer so the quiz still teaches. */
        .feedback strong { display: block; margin-bottom: 4px; font-size: .95rem; font-weight: 900; }
        .feedback .explain { display: block; color: var(--ink); font-weight: 600; }
    </style>
</head>
<body>
    <main class="shell">
        <section class="card" id="quiz">
            <header>
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">🌿</div>
                    <div><p class="kicker">Self-paced practice</p><h1>General Science T2 ST2 Reviewer</h1></div>
                </div>
                <div class="score" aria-live="polite"><span class="score-label">Score</span><span class="score-value" id="scoreValue">0 / 25</span></div>
            </header>
            <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
            <div class="meta"><span class="question-count" id="tracker">Question 1 of 25</span><span class="topic" id="topic"></span></div>
            <div class="question" id="question"></div>
            <div class="choices" id="choices"></div>
            <div class="feedback" id="feedback" aria-live="polite">Choose the answer you think is correct.</div>
            <div class="footer"><button class="next" id="next" type="button" onclick="nextQuestion()">Next question <span aria-hidden="true">→</span></button></div>
        </section>
        <section class="card" id="finish">
            <div class="finish-mark" aria-hidden="true">✓</div>
            <h2>Review complete.</h2>
            <p>You worked through all 25 General Science T2 ST2 questions.</p>
            <div class="final-score" id="finalScore"></div><br>
            <button class="restart" type="button" onclick="restartQuiz()" style="display:inline-flex">Review again <span aria-hidden="true">↻</span></button>
        </section>
    </main>

    <script>
        // Twenty-five T2 ST2 questions covering living systems, organs, cell energy, and plant transport.
        // Choices are kept close in length so the longest option doesn't give the answer away.
        const allQuestions = [
            { q: "Which of the following is an example of a biological system?", options: { A: "A rock on the ground", B: "A growing mango tree", C: "A sharpened pencil", D: "A glass of tap water" }, answer: "B", explain: "A tree is alive. Its roots, stem, and leaves work together to keep it growing, so it is a biological system." },
            { q: "What does a biological system consist of?", options: { A: "Parts that always work alone", B: "Parts that never affect each other", C: "Related parts working together", D: "Parts with no set function" }, answer: "C", explain: "A system is a group of related parts that depend on each other and work together to do a job." },
            { q: "A plant's roots cannot absorb enough water. Which plant function will be affected first?", options: { A: "Taking in water from the soil", B: "Producing seeds right away", C: "Giving flowers bright colors", D: "Spreading pollen to flowers" }, answer: "A", explain: "Roots are the part that take in water. If they fail, water uptake is the first job affected, and other parts suffer later." },
            { q: "A bird uses its beak to pick up food and its digestive system to process it. What does this show?", options: { A: "All body parts do the same job.", B: "Body parts work together for life.", C: "The beak digests all of the food.", D: "Digestion can work without any food." }, answer: "B", explain: "The beak gathers food and the digestive system breaks it down: different parts with different jobs cooperating to keep the bird alive." },
            { q: "If a fish's gills are damaged, which activity will become difficult?", options: { A: "Swimming forward fast", B: "Searching for food", C: "Turning in the water", D: "Taking in oxygen" }, answer: "D", explain: "Gills take dissolved oxygen out of water. Damaged gills mean the fish can't get enough oxygen." },
            { q: "Which plant part absorbs water and minerals from the soil?", options: { A: "Flower", B: "Leaf", C: "Root", D: "Fruit" }, answer: "C", explain: "Roots, especially their tiny root hairs, absorb water and minerals from the soil." },
            { q: "Which organ pumps blood throughout the human body?", options: { A: "Heart", B: "Brain", C: "Stomach", D: "Lungs" }, answer: "A", explain: "The heart is a muscular pump that pushes blood through blood vessels to every part of the body." },
            { q: "Which plant organ mainly produces food through photosynthesis?", options: { A: "Root", B: "Leaf", C: "Flower", D: "Fruit" }, answer: "B", explain: "Leaves contain chlorophyll and capture sunlight, so most photosynthesis happens there." },
            { q: "What is the main function of the lungs?", options: { A: "Breaking down eaten food", B: "Pumping blood to the body", C: "Absorbing minerals from soil", D: "Exchanging oxygen and CO₂" }, answer: "D", explain: "In the lungs, oxygen enters the blood and carbon dioxide leaves it. This is called gas exchange." },
            { q: "A plant has damaged roots. Which material will it have difficulty absorbing?", options: { A: "Sunlight", B: "Water", C: "Carbon dioxide", D: "Oxygen gas" }, answer: "B", explain: "Water comes in through the roots. Sunlight and carbon dioxide are taken in by the leaves instead." },
            // { q: "A person runs and needs more oxygen. Which organs help take in oxygen and deliver it through the blood?", options: { A: "Stomach and intestines", B: "Bones and muscles", C: "Lungs and heart", D: "Kidneys and bladder" }, answer: "C", explain: "The lungs bring oxygen into the blood, and the heart pumps that oxygen-rich blood to the working muscles." },
            // { q: "A leaf is covered so that it cannot receive sunlight. Which process will be reduced?", options: { A: "Photosynthesis in leaves", B: "Water uptake by roots", C: "Mineral uptake by roots", D: "Seed dispersal by wind" }, answer: "A", explain: "Photosynthesis needs light energy. Without sunlight, the leaf can't make as much food." },
            { q: "A person's small intestine is not working properly. Which process will be directly affected?", options: { A: "Pumping blood", B: "Breathing in air", C: "Holding up the body", D: "Absorbing nutrients" }, answer: "D", explain: "The small intestine absorbs nutrients from digested food into the bloodstream." },
            { q: "What is the process by which plants make their own food using sunlight?", options: { A: "Transpiration", B: "Photosynthesis", C: "Respiration", D: "Germination" }, answer: "B", explain: "Photosynthesis uses light energy, carbon dioxide, and water to make glucose (food) and oxygen." },
            { q: "What process releases usable energy from food inside cells?", options: { A: "Photosynthesis", B: "Plant transpiration", C: "Cellular respiration", D: "Seed germination" }, answer: "C", explain: "Cellular respiration breaks down glucose with oxygen to release energy the cell can use." },
            { q: "A student eats rice before playing basketball. How does the body use the nutrients from rice?", options: { A: "To supply energy for activities", B: "To change bones into food", C: "To stop cellular respiration", D: "To block oxygen from entering" }, answer: "A", explain: "Rice is rich in carbohydrates. The body breaks them into glucose, which cells use as fuel for movement." },
            { q: "A plant is kept in a dark room for several days. Which process will be directly limited because of the lack of light?", options: { A: "Digestion", B: "Blood circulation", C: "Cellular respiration", D: "Photosynthesis" }, answer: "D", explain: "Photosynthesis is the process that depends on light. Respiration keeps going in the dark." },
            { q: "A person's muscle cells need energy during exercise. Which process helps release energy from glucose?", options: { A: "Flower pollination", B: "Cellular respiration", C: "Leaf transpiration", D: "Water absorption" }, answer: "B", explain: "Muscle cells use cellular respiration to break down glucose and release the energy they need to contract." },
            // { q: "A plant receives sunlight and has enough water and carbon dioxide. What can its cells do?", options: { A: "Produce red blood cells", B: "Digest trapped insects", C: "Make glucose for food", D: "Stop using any energy" }, answer: "C", explain: "Sunlight, water, and carbon dioxide are everything photosynthesis needs, so the cells can make glucose." },
            // { q: "A person skips meals and has little energy for daily activities. What is the best explanation?", options: { A: "Less fuel is left for respiration.", B: "The cells no longer need any energy.", C: "The lungs start producing glucose.", D: "The bones carry out photosynthesis." }, answer: "A", explain: "Food supplies the glucose that cellular respiration breaks down. Less food means less fuel and less energy released." },
            // { q: "A plant's cells need energy to grow new leaves. Which statement best explains how the plant obtains this energy?", options: { A: "Roots absorb sunlight from the soil.", B: "Leaves take ready-made food from air.", C: "Flowers turn minerals into energy.", D: "Cells break down sugar in respiration." }, answer: "D", explain: "Plants make sugar through photosynthesis, but their cells still release energy from that sugar through cellular respiration." },
            { q: "Why are roots important to the transport of materials in plants?", options: { A: "They produce their own sunlight.", B: "They absorb water and minerals.", C: "They do all of the photosynthesis.", D: "They release oxygen into the soil." }, answer: "B", explain: "Roots take in water and minerals, which the xylem then carries up to the stem and leaves." },
            { q: "What is the main function of the xylem in a plant?", options: { A: "Carries sugar from leaves to roots", B: "Produces seeds for reproduction", C: "Carries water up from the roots", D: "Absorbs sunlight for the leaves" }, answer: "C", explain: "Xylem moves water and minerals upward from the roots. Remember: xylem carries water, phloem carries food." },
            { q: "A plant's xylem is damaged. Which process will most likely be affected?", options: { A: "Water moving from roots to leaves", B: "Leaves absorbing sunlight energy", C: "Flowers producing their pollen", D: "Fruits forming new seeds inside" }, answer: "A", explain: "Xylem is the plant's water pipeline. If it is damaged, water can't reach the leaves properly." },
            { q: "A plant produces sugar in its leaves. Which tissue transports sugars to other parts of the plant, such as roots and growing stems?", options: { A: "Xylem", B: "Epidermis", C: "Root hairs", D: "Phloem" }, answer: "D", explain: "Phloem carries sugars made in the leaves to the roots, stems, and other parts that need food." }
        ];

        allQuestions.forEach((question, index) => {
            if (index < 5) question.topic = "Living Things as Systems";
            else if (index < 13) question.topic = "Organs & Their Functions";
            else if (index < 21) question.topic = "Energy in Cells";
            else question.topic = "Transport in Plants";
        });

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        const questionEl = document.getElementById("question");
        const choicesEl = document.getElementById("choices");
        const trackerEl = document.getElementById("tracker");
        const topicEl = document.getElementById("topic");
        const progressBar = document.getElementById("progressBar");
        const feedback = document.getElementById("feedback");
        const scoreValue = document.getElementById("scoreValue");
        const finalScore = document.getElementById("finalScore");
        const nextBtn = document.getElementById("next");
        const quiz = document.getElementById("quiz");
        const finish = document.getElementById("finish");

        function shuffled(items) {
            const copy = [...items];
            for (let index = copy.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
            }
            return copy;
        }

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = "none";
            choicesEl.innerHTML = "";

            const item = questions[currentIndex];
            trackerEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
            topicEl.textContent = item.topic;
            progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            questionEl.textContent = item.q;
            questionEl.classList.remove("enter");
            void questionEl.offsetWidth;
            questionEl.classList.add("enter");
            feedback.className = "feedback";
            feedback.textContent = "Choose the answer you think is correct.";
            scoreValue.textContent = `${score} / ${questions.length}`;

            const displayLetters = ["A", "B", "C", "D"];
            shuffled(Object.entries(item.options)).forEach(([originalLetter, text], index) => {
                const button = document.createElement("button");
                button.className = "choice";
                button.type = "button";
                button.dataset.answer = originalLetter;
                button.innerHTML = `<span class="letter">${displayLetters[index]}</span><span>${text}</span><span class="result" aria-hidden="true"></span>`;
                button.onclick = () => checkAnswer(originalLetter, button, item);
                choicesEl.appendChild(button);
            });
        }

        function showFeedback(state, heading, explanation) {
            feedback.className = `feedback ${state}`;
            feedback.innerHTML = `<strong>${heading}</strong><span class="explain">${explanation}</span>`;
        }

        function checkAnswer(selected, button, item) {
            if (answered) return;
            answered = true;

            const correct = item.answer;
            const buttons = [...choicesEl.querySelectorAll(".choice")];
            buttons.forEach(choice => { choice.disabled = true; });

            if (selected === correct) {
                score++;
                button.classList.add("correct", "celebrate");
                button.querySelector(".result").textContent = "✓";
                showFeedback("correct", "Correct! Nice work.", item.explain);
                celebrate();
            } else {
                button.classList.add("wrong");
                button.querySelector(".result").textContent = "×";
                const correctButton = buttons.find(choice => choice.dataset.answer === correct);
                if (correctButton) {
                    correctButton.classList.add("correct");
                    correctButton.querySelector(".result").textContent = "✓";
                }
                showFeedback("wrong", `Not quite. The answer is "${item.options[correct]}".`, item.explain);
            }

            scoreValue.textContent = `${score} / ${questions.length}`;
            nextBtn.style.display = "inline-flex";
            nextBtn.focus();
        }

        function celebrate() {
            const layer = document.createElement("div");
            layer.className = "celebration";
            for (let index = 0; index < 18; index++) {
                const spark = document.createElement("i");
                spark.className = "spark";
                const angle = (Math.PI * 2 * index) / 18;
                const distance = 90 + Math.random() * 110;
                spark.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
                spark.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
                spark.style.setProperty("--r", `${Math.random() * 360}deg`);
                layer.appendChild(spark);
            }
            document.body.appendChild(layer);
            window.setTimeout(() => layer.remove(), 850);
        }

        function nextQuestion() {
            if (!answered) return;
            currentIndex++;
            if (currentIndex < questions.length) loadQuestion();
            else showFinish();
        }

        function showFinish() {
            quiz.style.display = "none";
            finish.style.display = "block";
            finalScore.textContent = `Final score: ${score} / ${questions.length}`;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function restartQuiz() {
            questions = shuffled(allQuestions);
            currentIndex = 0;
            score = 0;
            answered = false;
            finish.style.display = "none";
            quiz.style.display = "block";
            loadQuestion();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        restartQuiz();
    </script>
</body>
</html>
