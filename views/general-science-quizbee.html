<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Science Reviewer</title>
    <style>
        :root {
            --night:#073b3a; --deep:#062d35; --paper:#f9f7ee; --ink:#17333a; --muted:#60777b;
            --teal:#0cae9b; --aqua:#52d9c7; --sun:#ffbc42; --coral:#ff6b5f; --green:#13a86b;
        }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; overflow-x:hidden; color:var(--ink); font-family:"Segoe UI",Inter,system-ui,sans-serif; background:radial-gradient(circle at 15% 18%,rgba(82,217,199,.3),transparent 24rem),radial-gradient(circle at 90% 85%,rgba(255,188,66,.25),transparent 28rem),linear-gradient(145deg,var(--night),var(--deep)); }
        body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.28; background-image:radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1px); background-size:32px 32px; mask-image:linear-gradient(135deg,black,transparent 75%); }
        .atom { position:fixed; z-index:0; width:220px; aspect-ratio:1; border:2px solid rgba(255,255,255,.12); border-radius:50%; pointer-events:none; animation:float 8s ease-in-out infinite alternate; }
        .atom::before,.atom::after { content:""; position:absolute; inset:0; border:inherit; border-radius:inherit; transform:rotate(60deg); }
        .atom::after { transform:rotate(120deg); }
        .atom.one { top:-95px; right:4%; }
        .atom.two { bottom:-125px; left:3%; transform:scale(.7); animation-delay:-3s; }
        .shell { position:relative; z-index:1; width:min(1280px,calc(100% - 32px)); min-height:calc(100vh - 32px); margin:16px auto; display:grid; align-content:center; }
        .card { position:relative; overflow:hidden; padding:clamp(24px,3.8vw,50px); border:1px solid rgba(255,255,255,.45); border-radius:34px; background:var(--paper); box-shadow:0 34px 80px rgba(0,20,24,.36); }
        .card::after { content:""; position:absolute; top:0; left:0; width:100%; height:8px; background:linear-gradient(90deg,var(--teal),var(--sun),var(--coral)); }
        header { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:22px; }
        .brand { display:flex; align-items:center; gap:16px; }
        .brand-icon { display:grid; place-items:center; width:62px; height:62px; flex:0 0 auto; border-radius:20px; color:white; background:linear-gradient(145deg,var(--teal),#087983); box-shadow:0 12px 26px rgba(12,174,155,.26); font-size:31px; }
        .kicker { margin:0 0 3px; color:#088978; font-size:.78rem; font-weight:900; letter-spacing:.19em; text-transform:uppercase; }
        h1 { margin:0; color:#12383c; font-size:clamp(1.45rem,2.7vw,2.2rem); letter-spacing:-.04em; }
        .timer { display:flex; align-items:center; justify-content:center; gap:8px; min-width:116px; padding:12px 17px; border:2px solid #bce4dc; border-radius:18px; color:#087c70; background:#e8f8f3; font-size:1.12rem; font-weight:950; font-variant-numeric:tabular-nums; transition:.2s ease; }
        .timer.warning { color:#986008; border-color:#f2cf84; background:#fff5dc; }
        .timer.danger { color:#b5383f; border-color:#f3a9aa; background:#fff0ef; animation:pulse .75s ease-in-out infinite alternate; }
        .progress-track { height:7px; margin-bottom:24px; overflow:hidden; border-radius:999px; background:#deebe7; }
        .progress-bar { width:2.5%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--teal),var(--sun)); transition:width .35s ease; }
        .meta { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
        .question-count,.topic { padding:8px 13px; border-radius:999px; font-size:.78rem; font-weight:900; letter-spacing:.09em; text-transform:uppercase; }
        .question-count { color:#315a5d; border:1px solid #d4e3df; background:#edf3f0; }
        .topic { color:#087d71; border:1px solid #b9e3da; background:#e6f7f2; }
        .stage { position:relative; }
        .quiz-content { transition:opacity .28s ease,filter .28s ease,transform .28s ease; }
        .quiz-content.concealed { opacity:0; visibility:hidden; filter:blur(9px); transform:scale(.985); }
        .question { min-height:2.5em; margin:0 0 clamp(25px,3.5vw,40px); color:#14373d; font-size:clamp(1.75rem,3.15vw,3rem); line-height:1.18; font-weight:800; letter-spacing:-.04em; }
        .choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
        .choice { min-height:92px; display:flex; align-items:center; gap:16px; padding:16px 18px; border:2px solid #dce8e4; border-radius:20px; color:#24474c; background:white; box-shadow:0 7px 18px rgba(11,59,56,.06); font:inherit; font-size:clamp(1.03rem,1.75vw,1.38rem); font-weight:700; line-height:1.27; text-align:left; cursor:pointer; transition:.18s ease; }
        .choice:hover:not(:disabled) { transform:translateY(-3px); border-color:var(--teal); box-shadow:0 13px 26px rgba(12,174,155,.13); }
        .choice:focus-visible { outline:3px solid #48c9b7; outline-offset:3px; }
        .choice:disabled { cursor:default; }
        .choice.locked { opacity:.76; cursor:not-allowed; }
        .letter { display:grid; place-items:center; width:50px; height:50px; flex:0 0 50px; border-radius:15px; color:#087c70; border:1px solid #b9e3da; background:#e8f7f3; font-size:1.35rem; font-weight:950; }
        .result { margin-left:auto; opacity:0; font-size:1.8rem; font-weight:950; transform:scale(.65); transition:.2s ease; }
        .choice.correct { color:#0d5137; border-color:#25b878; background:#e9fbf2; box-shadow:0 0 0 3px rgba(19,168,107,.1); }
        .choice.correct .letter { color:white; border-color:var(--green); background:var(--green); }
        .choice.wrong { color:#872f34; border-color:#ee6c70; background:#fff0ef; }
        .choice.wrong .letter { color:white; border-color:var(--coral); background:var(--coral); }
        .choice.correct .result,.choice.wrong .result { opacity:1; transform:scale(1); }
        .timeup { position:absolute; inset:0; z-index:4; display:none; place-items:center; padding:24px; border:2px dashed #f0c46b; border-radius:24px; text-align:center; background:linear-gradient(145deg,#fffaf0,#f5fbf7); }
        .timeup.show { display:grid; animation:rise .3s ease both; }
        .timeup-icon { display:grid; place-items:center; width:74px; height:74px; margin:0 auto 18px; border-radius:23px; color:white; background:linear-gradient(145deg,var(--sun),var(--coral)); box-shadow:0 15px 30px rgba(255,107,95,.2); font-size:2rem; }
        .timeup h2 { margin:0 0 7px; color:#173d41; font-size:clamp(2rem,4vw,3.2rem); letter-spacing:-.04em; }
        .timeup p { margin:0 0 23px; color:var(--muted); font-size:1.03rem; }
        .reveal,.next,.restart { display:inline-flex; align-items:center; gap:10px; padding:14px 23px; border:0; border-radius:15px; color:white; background:linear-gradient(135deg,#0caf9c,#087b83); box-shadow:0 11px 24px rgba(12,174,155,.2); font:inherit; font-size:1.03rem; font-weight:900; cursor:pointer; transition:.18s ease; }
        .reveal { background:linear-gradient(135deg,var(--sun),var(--coral)); box-shadow:0 11px 24px rgba(255,107,95,.18); }
        .reveal:hover,.next:hover,.restart:hover { transform:translateY(-2px); filter:brightness(1.06); }
        .footer { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:56px; margin-top:20px; }
        .helper { display:flex; align-items:center; gap:9px; margin:0; color:var(--muted); font-size:.94rem; }
        .helper-symbol { color:#099484; font-weight:950; }
        .next { display:none; margin-left:auto; }
        #finish { display:none; text-align:center; padding-block:clamp(60px,10vw,110px); }
        .finish-mark { display:grid; place-items:center; width:106px; height:106px; margin:0 auto 26px; border-radius:50% 50% 46% 54%; color:white; background:linear-gradient(145deg,var(--teal),var(--sun)); box-shadow:0 20px 38px rgba(12,174,155,.25); font-size:3.2rem; }
        #finish h2 { margin:0 0 12px; color:#12383c; font-size:clamp(2.6rem,6vw,5rem); letter-spacing:-.055em; }
        #finish p { max-width:620px; margin:0 auto 28px; color:var(--muted); font-size:clamp(1.12rem,2.1vw,1.5rem); line-height:1.5; }
        .enter { animation:rise .38s ease both; }
        @keyframes rise { from{opacity:0;transform:translateY(11px)} to{opacity:1;transform:translateY(0)} }
        @keyframes float { to{transform:translate3d(20px,26px,0) rotate(8deg)} }
        @keyframes pulse { to{box-shadow:0 0 0 6px rgba(255,107,95,.1)} }
        @media(max-width:760px) { .shell{width:calc(100% - 18px);margin:9px auto}.card{padding:22px 17px;border-radius:23px}.brand-icon{width:49px;height:49px;border-radius:15px;font-size:24px}.timer{min-width:92px;padding:10px 12px}.choices{grid-template-columns:1fr;gap:10px}.choice{min-height:74px;padding:11px 13px;border-radius:16px}.letter{width:44px;height:44px;flex-basis:44px;border-radius:12px}.footer{align-items:flex-end}.helper{font-size:.81rem} }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

        /* Mobile-first reviewer theme */
        :root { --paper:#fffdf6; --ink:#171717; --muted:#626262; --line:#171717; --soft:#f1efe6; --accent:#f6d365; --success:#c8f7d4; --danger:#ffd5d2; }
        body { min-height:100vh; color:var(--ink); background:#e9e7df; font-family:Inter,"Segoe UI",system-ui,sans-serif; }
        body::before,.atom { display:none; }
        .shell { width:100%; min-height:100vh; margin:0; padding:0; display:block; }
        .card { min-height:100vh; padding:20px 16px 28px; overflow:visible; border:0; border-radius:0; background:var(--paper); box-shadow:none; }
        .card::after { display:none; }
        header { align-items:flex-start; gap:12px; margin-bottom:18px; }
        .brand { align-items:flex-start; gap:11px; }
        .brand-icon { width:44px; height:44px; border:2px solid var(--line); border-radius:8px; color:var(--ink); background:var(--accent); box-shadow:3px 3px 0 var(--line); font-size:21px; }
        .kicker { margin-bottom:2px; color:var(--muted); font-size:.67rem; letter-spacing:.14em; }
        h1 { color:var(--ink); font-size:1.22rem; letter-spacing:-.025em; }
        .score { min-width:78px; padding:8px 10px; border:2px solid var(--line); border-radius:8px; background:white; box-shadow:3px 3px 0 var(--line); text-align:center; }
        .score-label { display:block; color:var(--muted); font-size:.62rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
        .score-value { display:block; margin-top:1px; font-size:1.04rem; font-weight:950; font-variant-numeric:tabular-nums; }
        .progress-track { height:9px; margin-bottom:18px; border:2px solid var(--line); border-radius:0; background:white; }
        .progress-bar { background:var(--ink); border-radius:0; }
        .meta { flex-wrap:wrap; gap:8px; margin-bottom:14px; }
        .question-count,.topic { padding:6px 9px; border:2px solid var(--line); border-radius:6px; color:var(--ink); background:white; font-size:.66rem; }
        .topic { background:var(--accent); }
        .question { min-height:auto; margin:0 0 20px; color:var(--ink); font-size:clamp(1.42rem,7vw,2rem); line-height:1.22; letter-spacing:-.035em; }
        .choices { grid-template-columns:1fr; gap:11px; }
        .choice { width:100%; min-height:68px; gap:12px; padding:12px; border:2px solid var(--line); border-radius:8px; color:var(--ink); background:white; box-shadow:4px 4px 0 var(--line); font-size:1rem; font-weight:700; transition:transform .16s ease,box-shadow .16s ease,background .16s ease; }
        .choice:hover:not(:disabled) { transform:translate(-1px,-1px); border-color:var(--line); box-shadow:6px 6px 0 var(--line); }
        .choice:active:not(:disabled) { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line); }
        .choice:focus-visible { outline:4px solid #90b9ff; outline-offset:3px; }
        .choice:disabled { opacity:1; }
        .letter { width:38px; height:38px; flex-basis:38px; border:2px solid var(--line); border-radius:6px; color:var(--ink); background:var(--soft); font-size:1rem; }
        .result { font-size:1.3rem; }
        .choice.correct { color:var(--ink); border-color:var(--line); background:var(--success); box-shadow:4px 4px 0 var(--line); }
        .choice.correct .letter { color:var(--ink); border-color:var(--line); background:white; }
        .choice.wrong { color:var(--ink); border-color:var(--line); background:var(--danger); }
        .choice.wrong .letter { color:var(--ink); border-color:var(--line); background:white; }
        .choice.celebrate { animation:correct-pop .55s cubic-bezier(.2,.9,.25,1.35); }
        .celebration { position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none; }
        .spark { position:absolute; left:50%; top:52%; width:10px; height:14px; border:2px solid var(--line); background:var(--accent); animation:burst .8s ease-out forwards; }
        .spark:nth-child(3n) { background:#9fe3c2; }
        .spark:nth-child(3n + 1) { background:#a9c9ff; }
        .feedback { min-height:48px; margin-top:17px; padding:11px 12px; border:2px solid transparent; border-radius:8px; color:var(--muted); font-size:.88rem; font-weight:650; line-height:1.45; }
        .feedback.correct { color:var(--ink); border-color:var(--line); background:var(--success); }
        .feedback.wrong { color:var(--ink); border-color:var(--line); background:var(--danger); }
        .footer { align-items:center; margin-top:10px; }
        .next,.restart { padding:12px 17px; border:2px solid var(--line); border-radius:8px; color:white; background:var(--ink); box-shadow:4px 4px 0 #818181; font-size:.94rem; }
        .next:hover,.restart:hover { transform:translate(-1px,-1px); filter:none; box-shadow:6px 6px 0 #818181; }
        #finish { min-height:100vh; padding:70px 20px; }
        .finish-mark { width:82px; height:82px; margin-bottom:22px; border:2px solid var(--line); border-radius:12px; color:var(--ink); background:var(--accent); box-shadow:6px 6px 0 var(--line); font-size:2.3rem; }
        #finish h2 { color:var(--ink); font-size:clamp(2rem,10vw,3.5rem); }
        #finish p { color:var(--muted); font-size:1rem; }
        .final-score { display:inline-block; margin:8px auto 24px; padding:10px 14px; border:2px solid var(--line); border-radius:8px; background:white; box-shadow:4px 4px 0 var(--line); font-size:1.15rem; font-weight:900; }
        @keyframes correct-pop { 0%{transform:scale(1)} 38%{transform:scale(1.035) rotate(-.6deg)} 68%{transform:scale(.99) rotate(.4deg)} 100%{transform:scale(1)} }
        @keyframes burst { to { opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r)); } }
        @media(min-width:700px) {
            .shell { display:grid; place-items:center; padding:28px; }
            .card { width:min(820px,100%); min-height:auto; padding:32px; border:2px solid var(--line); border-radius:12px; box-shadow:9px 9px 0 var(--line); }
            header { align-items:center; }
            h1 { font-size:1.6rem; }
            .question { font-size:2rem; }
            .choices { grid-template-columns:repeat(2,minmax(0,1fr)); }
            #finish { min-height:auto; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="card" id="quiz">
            <header>
                <div class="brand"><div class="brand-icon" aria-hidden="true">⚗</div><div><p class="kicker">Self-paced practice</p><h1>General Science Reviewer</h1></div></div>
                <div class="score" aria-live="polite"><span class="score-label">Score</span><span class="score-value" id="scoreValue">0 / 40</span></div>
            </header>
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
            <div class="meta"><span class="question-count" id="tracker">Question 1 of 40</span><span class="topic" id="topic"></span></div>
            <div class="question" id="question"></div>
            <div class="choices" id="choices"></div>
            <div class="feedback" id="feedback" aria-live="polite">Choose the answer you think is correct.</div>
            <div class="footer"><button class="next" id="next" type="button" onclick="nextQuestion()">Next question <span aria-hidden="true">→</span></button></div>
        </section>
        <section class="card" id="finish"><div class="finish-mark" aria-hidden="true">✓</div><h2>Review complete.</h2><p>You worked through all 40 General Science questions.</p><div class="final-score" id="finalScore"></div><br><button class="restart" type="button" onclick="restartQuiz()">Review again <span aria-hidden="true">↻</span></button></section>
    </main>
    <script>
        // Forty selected questions: eight each from Motion, Machines, Fluids, Electricity & Energy, and Waves.
        const allQuestions = [
            {topic:"Motion",q:"What do we call a change in an object's position compared with a fixed point over time?",options:{A:"Force",B:"Weight",C:"Speed",D:"Motion"},answer:"D"},
            {topic:"Motion",q:"What is the fixed point used to determine whether an object has moved?",options:{A:"Starting line",B:"Finish line",C:"Travel distance",D:"Reference point"},answer:"D"},
            {topic:"Motion",q:"In which type of motion do all parts of an object move in the same direction and cover the same distance?",options:{A:"Rotational motion",B:"Translational motion",C:"Vibrational motion",D:"Circular motion"},answer:"B"},
            {topic:"Motion",q:"Which situation is an example of rectilinear motion?",options:{A:"A car turning around a corner",B:"A ball following a curved arc",C:"An elevator moving straight upward",D:"A top spinning around its axis"},answer:"C"},
            {topic:"Motion",q:"How does rotational motion differ from translational motion?",options:{A:"It follows only a perfectly straight path.",B:"It occurs only when an object is in space.",C:"It happens without any passage of time.",D:"It turns around a fixed point or central axis."},answer:"D"},
            {topic:"Motion",q:"Which situation shows translational and rotational motion at the same time?",options:{A:"A sliding door moving along its track",B:"A moving car whose wheels are turning",C:"A closed book resting on a table",D:"A ceiling fan that has been switched off"},answer:"B"},
            {topic:"Motion",q:"What types of motion does a gymnast show while performing a flip through the air?",options:{A:"Translational and rotational motion",B:"Rotational motion without translation",C:"Translational motion without rotation",D:"No measurable motion during the flip"},answer:"A"},
            {topic:"Motion",q:"How must a revolving door move to operate correctly?",options:{A:"It must slide from side to side.",B:"It must spin around a central point.",C:"It must travel upward and downward.",D:"It must follow one straight path."},answer:"B"},

            {topic:"Simple Machines",q:"What basic tool makes work easier by changing the size or direction of a force?",options:{A:"Complex engine",B:"Electric battery",C:"Simple machine",D:"Power source"},answer:"C"},
            {topic:"Simple Machines",q:"Which simple machine is a stiff bar that turns around a fixed fulcrum?",options:{A:"Pulley",B:"Screw",C:"Lever",D:"Wedge"},answer:"C"},
            {topic:"Simple Machines",q:"What is a device made from two or more simple machines working together called?",options:{A:"Compound machine",B:"Powered machine",C:"Double machine",D:"Electric engine"},answer:"A"},
            {topic:"Simple Machines",q:"What is the main purpose of a simple machine?",options:{A:"To make tasks more convenient with less effort",B:"To remove the need to perform any work",C:"To increase the amount of work required",D:"To add more weight to the object being moved"},answer:"A"},
            {topic:"Simple Machines",q:"How does an inclined plane help move a heavy box to a higher place?",options:{A:"It decreases the actual weight of the box.",B:"It spreads the effort over a longer distance.",C:"It shortens the distance the box must move.",D:"It completely removes friction from the box."},answer:"B"},
            {topic:"Simple Machines",q:"Why is a bicycle considered a compound machine?",options:{A:"It is mainly designed for physical exercise.",B:"It operates using only one moving component.",C:"It combines levers, wheels, axles, and pulleys.",D:"It can travel at a relatively high speed."},answer:"C"},
            {topic:"Simple Machines",q:"Why is a pair of scissors considered a compound machine?",options:{A:"It combines a screw with a pulley.",B:"It combines two levers with two wedges.",C:"It combines an inclined plane with a wheel.",D:"It combines a lever with a wheel and axle."},answer:"B"},
            {topic:"Simple Machines",q:"Why is a can opener more effective than using only a knife to open a can?",options:{A:"It combines a lever, wheel and axle, and wedge.",B:"It provides a larger and less comfortable handle.",C:"It requires the user to apply a much greater force.",D:"It uses a sharper wedge without other machines."},answer:"A"},

            {topic:"Fluids",q:"Which principle states that pressure in a closed liquid spreads equally in all directions?",options:{A:"Pascal's Principle",B:"Archimedes' Principle",C:"Newton's Law",D:"Law of Gravity"},answer:"A"},
            {topic:"Fluids",q:"What is the upward force that a fluid exerts on an object called?",options:{A:"Friction force",B:"Fluid pressure",C:"Buoyant force",D:"Object density"},answer:"C"},
            {topic:"Fluids",q:"According to Archimedes' Principle, the buoyant force on an object equals what?",options:{A:"The total weight of the entire object",B:"The depth of the object below the surface",C:"The weight of the fluid displaced by the object",D:"The total volume of the fluid container"},answer:"C"},
            {topic:"Fluids",q:"How can a hydraulic machine lift a heavy object with a small applied force?",options:{A:"It removes some fluid from the closed system.",B:"It decreases the actual weight of the object.",C:"It transmits pressure through fluid to a larger area.",D:"It pulls the object upward using a long rope."},answer:"C"},
            {topic:"Fluids",q:"Why can a large metal ship float on the ocean?",options:{A:"The ship's metal is less dense than water.",B:"The ship's engine continuously pulls it upward.",C:"Deep ocean water produces no downward force.",D:"Its shape displaces enough water to balance its weight."},answer:"D"},
            {topic:"Fluids",q:"What happens when an object is denser than the liquid surrounding it?",options:{A:"It floats on the liquid's surface.",B:"It remains suspended in the middle.",C:"It sinks toward the bottom.",D:"It changes from a solid into a gas."},answer:"C"},
            {topic:"Fluids",q:"Which car component uses Pascal's Principle to help stop the vehicle?",options:{A:"Steering wheel",B:"Hydraulic brakes",C:"Rubber tires",D:"Windshield wipers"},answer:"B"},
            {topic:"Fluids",q:"How does a submarine change from floating to sinking?",options:{A:"It changes the color of its outer surface.",B:"It increases the speed of its propeller.",C:"It adjusts its density by changing its ballast.",D:"It switches off all of its internal lights."},answer:"C"},

            {topic:"Electricity & Energy",q:"What is it called when too many appliances are connected to one outlet?",options:{A:"Electrical overloading",B:"Faulty insulation",C:"Thermal conduction",D:"Magnetic induction"},answer:"A"},
            {topic:"Electricity & Energy",q:"What is an electric current passing through a person's body called?",options:{A:"Electrical overloading",B:"Electrical insulation",C:"Electromagnetic induction",D:"Electrocution"},answer:"D"},
            {topic:"Electricity & Energy",q:"Which material is an electrical insulator?",options:{A:"Copper wire",B:"Rubber coating",C:"Silver strip",D:"Aluminum foil"},answer:"B"},
            {topic:"Electricity & Energy",q:"Why is touching an electrical switch with wet hands dangerous?",options:{A:"Water blocks electricity from leaving the switch.",B:"Water slows electricity until heat builds up.",C:"Water conducts electricity and increases shock risk.",D:"Water removes the protective color from the switch."},answer:"C"},
            {topic:"Electricity & Energy",q:"What safety advice should you give someone fixing a lamp that is still plugged in?",options:{A:"Use a metal tool to reach the loose wire.",B:"Wear damp gloves while handling the lamp.",C:"Work quickly before the lamp becomes hotter.",D:"Unplug the lamp before attempting the repair."},answer:"D"},
            {topic:"Electricity & Energy",q:"What does energy conservation mean?",options:{A:"Using energy wisely and avoiding unnecessary waste",B:"Producing more energy than people can consume",C:"Using electrical devices only during nighttime",D:"Charging every battery whenever power is available"},answer:"A"},
            {topic:"Electricity & Energy",q:"Why are LED bulbs better for a school than incandescent bulbs?",options:{A:"They cost more to operate throughout the year.",B:"They release more electrical energy as heat.",C:"They provide light while using less electricity.",D:"They need to be replaced much more frequently."},answer:"C"},
            {topic:"Electricity & Energy",q:"What is the best way for a school to save energy during a sunny day?",options:{A:"Use daylight and switch off unnecessary lights.",B:"Close the curtains and turn on every light.",C:"Open windows while running the air conditioner.",D:"Turn on all computers even when they are unused."},answer:"A"},

            {topic:"Waves",q:"What is a wave?",options:{A:"An animal that lives in the ocean",B:"A measure of an object's temperature",C:"A piece of matter moving to a new place",D:"A disturbance that transfers energy"},answer:"D"},
            {topic:"Waves",q:"What is the highest point of a transverse wave called?",options:{A:"Trough",B:"Amplitude",C:"Crest",D:"Rest position"},answer:"C"},
            {topic:"Waves",q:"Which type of wave must have a medium such as air or water to travel?",options:{A:"Light wave",B:"Radio wave",C:"Mechanical wave",D:"X-ray wave"},answer:"C"},
            {topic:"Waves",q:"Which unit is used to measure the frequency of a wave?",options:{A:"Meters (m)",B:"Volts (V)",C:"Ohms (Ω)",D:"Hertz (Hz)"},answer:"D"},
            {topic:"Waves",q:"Sound is an example of which type of wave?",options:{A:"Transverse wave",B:"Longitudinal wave",C:"Electromagnetic wave",D:"Visible light wave"},answer:"B"},
            {topic:"Waves",q:"What happens to a wave's frequency when its wavelength becomes shorter at constant speed?",options:{A:"Its frequency remains exactly the same.",B:"Its frequency gradually becomes lower.",C:"Its frequency changes directly into energy.",D:"Its frequency becomes higher."},answer:"D"},
            {topic:"Waves",q:"How are electromagnetic waves different from mechanical waves?",options:{A:"They always travel at a much slower speed.",B:"They require a solid material for transmission.",C:"They can exist only when traveling through water.",D:"They can travel through the vacuum of space."},answer:"D"},
            {topic:"Waves",q:"Which part of the electromagnetic spectrum enables people to see colors?",options:{A:"Infrared radiation",B:"Ultraviolet radiation",C:"Visible light",D:"Radio waves"},answer:"C"}
        ];

        let questions=[];
        let currentIndex=0;
        let score=0;
        let answered=false;

        const questionEl=document.getElementById("question");
        const choicesEl=document.getElementById("choices");
        const trackerEl=document.getElementById("tracker");
        const topicEl=document.getElementById("topic");
        const progressBar=document.getElementById("progressBar");
        const feedback=document.getElementById("feedback");
        const scoreValue=document.getElementById("scoreValue");
        const finalScore=document.getElementById("finalScore");
        const nextBtn=document.getElementById("next");
        const quiz=document.getElementById("quiz");
        const finish=document.getElementById("finish");

        function shuffled(items){
            const copy=[...items];
            for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}
            return copy;
        }

        function loadQuestion(){
            answered=false;
            nextBtn.style.display="none";
            choicesEl.innerHTML="";
            const item=questions[currentIndex];
            trackerEl.textContent=`Question ${currentIndex+1} of ${questions.length}`;
            topicEl.textContent=item.topic;
            progressBar.style.width=`${((currentIndex+1)/questions.length)*100}%`;
            questionEl.textContent=item.q;
            questionEl.classList.remove("enter"); void questionEl.offsetWidth; questionEl.classList.add("enter");
            feedback.className="feedback";
            feedback.textContent="Choose the answer you think is correct.";
            scoreValue.textContent=`${score} / ${questions.length}`;
            const displayLetters=["A","B","C","D"];
            shuffled(Object.entries(item.options)).forEach(([originalLetter,text],index)=>{
                const button=document.createElement("button");
                button.className="choice";
                button.dataset.answer=originalLetter;
                button.innerHTML=`<span class="letter">${displayLetters[index]}</span><span>${text}</span><span class="result" aria-hidden="true"></span>`;
                button.onclick=()=>checkAnswer(originalLetter,button,item.answer);
                choicesEl.appendChild(button);
            });
        }

        function checkAnswer(selected,button,correct){
            if(answered)return;
            answered=true;
            const buttons=[...choicesEl.querySelectorAll(".choice")];
            buttons.forEach(choice=>choice.disabled=true);
            if(selected===correct){
                score++;
                button.classList.add("correct","celebrate");
                button.querySelector(".result").textContent="✓";
                feedback.className="feedback correct";
                feedback.textContent="Correct! Nice work — keep the momentum going.";
                celebrate();
            }else{
                button.classList.add("wrong");
                button.querySelector(".result").textContent="×";
                const correctButton=buttons.find(choice=>choice.dataset.answer===correct);
                if(correctButton){correctButton.classList.add("correct");correctButton.querySelector(".result").textContent="✓";}
                feedback.className="feedback wrong";
                feedback.textContent="Not quite. The correct answer is highlighted so you can review it.";
            }
            scoreValue.textContent=`${score} / ${questions.length}`;
            nextBtn.style.display="inline-flex";
            nextBtn.focus();
        }

        function celebrate(){
            const layer=document.createElement("div");
            layer.className="celebration";
            for(let i=0;i<18;i++){
                const spark=document.createElement("i");
                spark.className="spark";
                const angle=(Math.PI*2*i)/18;
                const distance=90+Math.random()*110;
                spark.style.setProperty("--x",`${Math.cos(angle)*distance}px`);
                spark.style.setProperty("--y",`${Math.sin(angle)*distance}px`);
                spark.style.setProperty("--r",`${Math.random()*360}deg`);
                layer.appendChild(spark);
            }
            document.body.appendChild(layer);
            window.setTimeout(()=>layer.remove(),850);
        }

        function nextQuestion(){
            if(!answered)return;
            currentIndex++;
            if(currentIndex<questions.length)loadQuestion();else showFinish();
        }

        function showFinish(){quiz.style.display="none";finish.style.display="block";finalScore.textContent=`Final score: ${score} / ${questions.length}`;window.scrollTo({top:0,behavior:"smooth"});}
        function restartQuiz(){questions=shuffled(allQuestions);currentIndex=0;score=0;answered=false;finish.style.display="none";quiz.style.display="block";loadQuestion();window.scrollTo({top:0,behavior:"smooth"});}

        restartQuiz();
    </script>
</body>
